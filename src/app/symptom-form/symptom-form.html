<div class="accordion">
  @for (group of groups(); track group.title; let g = $index) {
    <section class="accordion-item">
      <h2 class="accordion-header">
        <button
          type="button"
          class="accordion-button"
          [class.collapsed]="!isOpen(group.title)"
          [attr.aria-expanded]="isOpen(group.title)"
          [attr.aria-controls]="'group-' + g"
          (click)="toggle(group.title)"
        >
          {{ group.title }}
        </button>
      </h2>
      <div
        [id]="'group-' + g"
        class="accordion-collapse collapse"
        [class.show]="isOpen(group.title)"
      >
        <div class="row g-0">
          @for (s of group.items; track s.id; let i = $index) {
            <div class="col-12 col-md-6 p-3 border-bottom">
              @switch (s.input) {
                @case ('slider') {
                  <label
                    [for]="'sym-' + g + '-' + i"
                    class="form-label d-flex justify-content-between"
                  >
                    <span>{{ s.label }}</span>
                    <strong>{{ isTracked(s.id) ? values()[s.id] : '–' }}</strong>
                  </label>
                  <input
                    type="range"
                    class="form-range"
                    [id]="'sym-' + g + '-' + i"
                    min="0"
                    max="10"
                    step="1"
                    [disabled]="!isTracked(s.id)"
                    [ngModel]="values()[s.id]"
                    (ngModelChange)="setValue(s.id, $event)"
                  />
                  <div class="d-flex justify-content-between small text-body-secondary">
                    <span>Not at all</span>
                    <span>Severe</span>
                  </div>
                }
                @case ('radio') {
                  <div class="form-label" [id]="'sym-' + g + '-' + i">{{ s.label }}</div>
                  <div
                    class="btn-group flex-wrap"
                    role="group"
                    [attr.aria-labelledby]="'sym-' + g + '-' + i"
                  >
                    @for (option of s.options; track option; let o = $index) {
                      <input
                        type="radio"
                        class="btn-check"
                        autocomplete="off"
                        [name]="'sym-' + g + '-' + i"
                        [id]="'sym-' + g + '-' + i + '-' + o"
                        [value]="option"
                        [disabled]="!isTracked(s.id)"
                        [ngModel]="values()[s.id]"
                        (ngModelChange)="setValue(s.id, $event)"
                      />
                      <label
                        class="btn btn-outline-primary"
                        [for]="'sym-' + g + '-' + i + '-' + o"
                        >{{ option }}</label
                      >
                    }
                  </div>
                }
                @case ('checkbox') {
                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      [id]="'sym-' + g + '-' + i"
                      [disabled]="!isTracked(s.id)"
                      [ngModel]="values()[s.id]"
                      (ngModelChange)="setValue(s.id, $event)"
                    />
                    <label class="form-check-label" [for]="'sym-' + g + '-' + i">{{
                      s.label
                    }}</label>
                  </div>
                }
              }
              <div class="form-check mt-2">
                <input
                  class="form-check-input"
                  type="checkbox"
                  [id]="'skip-' + g + '-' + i"
                  [checked]="!isTracked(s.id)"
                  (change)="setTracked(s, !skip.checked)"
                  #skip
                />
                <label
                  class="form-check-label small text-body-secondary"
                  [for]="'skip-' + g + '-' + i"
                  >Not tracking today</label
                >
              </div>
            </div>
          }
        </div>
      </div>
    </section>
  }
</div>
